<svg xmlns="http://www.w3.org/2000/svg">
  <filter id="liquid-glass-header" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
    <feTurbulence
      type="fractalNoise"
      baseFrequency="0.009 0.013"
      numOctaves="3"
      seed="7"
      result="noise"
    />
    <feColorMatrix
      in="noise"
      type="matrix"
      values="1.9 0 0 0 -0.22 0 1.9 0 0 -0.22 0 0 1.9 0 -0.22 0 0 0 1 0"
      result="boostedNoise"
    />
    <feGaussianBlur in="boostedNoise" stdDeviation="1.8" result="softNoise" />
    <feDisplacementMap
      in="SourceGraphic"
      in2="softNoise"
      scale="-86"
      xChannelSelector="R"
      yChannelSelector="B"
    />
  </filter>
</svg>
